<!DOCTYPE html>
<html>
<head>
<title>Milana Puzzle ❤️</title>

<style>
body {
    background: #ffe6ee;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #ff4d88;
}

#puzzle {
    width: 600px;
    height: 600px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 2px;
}

.piece {
    width: 100%;
    height: 100%;
    background-image: url("puzzle.webp");
    background-size: 600px 600px;
    background-repeat: no-repeat;
    cursor: grab;
    border: 1px solid white;
    box-sizing: border-box;
}

.piece:active {
    cursor: grabbing;
}

#win {
    display: none;
}

button, a {
    background: #ff4d88;
    color: white;
    border: none;
    padding: 15px 25px;
    border-radius: 20px;
    text-decoration: none;
    font-size: 18px;
}
</style>

</head>

<body>

<h1>HAI MILANA ❤️</h1>

<div id="puzzle"></div>

<div id="win">
    <h1>Bravoooo! ❤️</h1>
    <p>Primul pas na bazu)</p>

    <a href="https://stefxdd.github.io/LoveYouMilana/" target="_blank">
        Continue ❤️
    </a>
</div>


<script>

const puzzle = document.getElementById("puzzle");

let pieces = [];


// Create 16 pieces
for (let i = 0; i < 16; i++) {

    let piece = document.createElement("div");
    piece.className = "piece";

    let column = i % 4;
    let row = Math.floor(i / 4);

    piece.style.backgroundPosition =
        `-${column * 150}px -${row * 150}px`;

    piece.dataset.correct = i;

    pieces.push(piece);
}


// Shuffle pieces
pieces.sort(() => Math.random() - 0.5);


// Add pieces
pieces.forEach(piece => {
    puzzle.appendChild(piece);
});


// Drag and drop
let selected = null;

document.querySelectorAll(".piece").forEach(piece => {

    piece.draggable = true;

    piece.addEventListener("dragstart", () => {
        selected = piece;
    });


    piece.addEventListener("dragover", e => {
        e.preventDefault();
    });


    piece.addEventListener("drop", () => {

        if (selected && selected !== piece) {

            let temp = piece.style.backgroundPosition;

            piece.style.backgroundPosition =
            selected.style.backgroundPosition;

            selected.style.backgroundPosition =
            temp;

            checkPuzzle();
        }

    });

});


// Check completion
function checkPuzzle(){

    let solved = true;

    let piecesNow = document.querySelectorAll(".piece");


    piecesNow.forEach((piece,index)=>{

        let correctColumn = index % 4;
        let correctRow = Math.floor(index / 4);

        let correctPosition =
        `-${correctColumn * 150}px -${correctRow * 150}px`;


        if(piece.style.backgroundPosition !== correctPosition){
            solved = false;
        }

    });


    if(solved){

        puzzle.style.display = "none";
        document.querySelector("body > h1").style.display = "none";
        document.getElementById("win").style.display = "block";

    }

}

</script>

</body>
</html>
