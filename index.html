<!DOCTYPE html>
<html>
<head>
<title>HAI MILANA ❤️</title>

<style>
body {
    background:#ffe6ee;
    font-family:Arial;
    text-align:center;
}

h1 {
    color:#ff4d88;
}

#puzzle {
    width:90vw;
    max-width:600px;
    aspect-ratio:1;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:2px;
}

.piece {
    width:100%;
    aspect-ratio:1;
    background-image:url("puzzle.webp");
    background-size:400% 400%;
    border:1px solid white;
    touch-action:none;
}

#win {
    display:none;
}

a {
    display:inline-block;
    margin-top:20px;
    background:#ff4d88;
    color:white;
    padding:15px 25px;
    border-radius:20px;
    text-decoration:none;
}
</style>

</head>

<body>

<h1>EU CRED IN TINE ❤️</h1>

<div id="puzzle"></div>

<div id="win">
<h1>BRAVOOOO! ❤️</h1>
<p>PRMUL PAS NA BAZU!</p>

<a href="https://stefxdd.github.io/LoveYouMilana/">
Continue ❤️
</a>

</div>


<script>

const puzzle=document.getElementById("puzzle");

let pieces=[];


// create pieces

for(let i=0;i<16;i++){

let piece=document.createElement("div");

piece.className="piece";

let x=i%4;
let y=Math.floor(i/4);


// image position
piece.style.backgroundPosition=
`${x*33.33}% ${y*33.33}%`;


piece.dataset.correct=i;

pieces.push(piece);

}


// shuffle

pieces.sort(()=>Math.random()-0.5);


pieces.forEach(p=>puzzle.appendChild(p));


// touch + mouse swapping

let selected=null;


document.querySelectorAll(".piece").forEach(piece=>{


piece.addEventListener("pointerdown",()=>{
selected=piece;
piece.style.opacity="0.5";
});


piece.addEventListener("pointerup",()=>{

if(selected && selected!==piece){

let a=selected.style.backgroundPosition;
selected.style.backgroundPosition=
piece.style.backgroundPosition;

piece.style.backgroundPosition=a;

check();

}

selected=null;

document.querySelectorAll(".piece")
.forEach(p=>p.style.opacity="1");

});


});



function check(){

let solved=true;

let all=document.querySelectorAll(".piece");


all.forEach((p,index)=>{

let x=index%4;
let y=Math.floor(index/4);

let correct=
`${x*33.33}% ${y*33.33}%`;


if(p.style.backgroundPosition!==correct)
solved=false;


});


if(solved){

document.getElementById("puzzle").style.display="none";

document.querySelector("body > h1").style.display="none";

document.getElementById("win").style.display="block";

}

}


</script>


</body>
</html>
