<!DOCTYPE html>
<html>
<head>
<title>MILANA PUZZLE ❤️</title>

<style>

body {
    background:#ffe6ee;
    font-family:Arial, sans-serif;
    text-align:center;
}

h1 {
    color:#ff4d88;
}

#puzzle {

    width:90vw;
    max-width:600px;
    aspect-ratio:1;
    margin:20px auto;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:2px;
}


.piece {

    width:100%;
    aspect-ratio:1;

    background-image:url("puzzle.webp");
    background-size:400% 400%;
    background-repeat:no-repeat;

    border:1px solid white;

    touch-action:none;
}


#win {

    display:none;

}


a {

    display:inline-block;

    margin-top:20px;

    background:#ff4d88;

    color:white;

    padding:15px 25px;

    border-radius:20px;

    text-decoration:none;

    font-size:18px;

}

</style>

</head>


<body>


<h1>HAI MILANA ❤️</h1>


<div id="puzzle"></div>



<div id="win">

<h1>URAAAA! ❤️</h1>

<p>PRIMUL PAS NA BAZU)!</p>


<a>Urmatoarea statie</a>href=
"https://stefxdd.github.io/LoveYouMilana/";



endButton.onclick=function(e){


e.preventDefault();


window.location.href=
"https://stefxdd.github.io/LoveYouMilana/";


};



}
    
</a>


</div>




<script>


const puzzle = document.getElementById("puzzle");

let pieces = [];



// Create 16 puzzle pieces

for(let i = 0; i < 16; i++){


    let piece = document.createElement("div");

    piece.className="piece";


    let x = i % 4;

    let y = Math.floor(i / 4);



    piece.style.backgroundPosition =
    `${x * 33.33}% ${y * 33.33}%`;



    piece.dataset.correct=i;


    pieces.push(piece);


}




// Shuffle pieces

pieces.sort(() => Math.random() - 0.5);



// Add pieces

pieces.forEach(piece=>{

    puzzle.appendChild(piece);

});





// Drag / touch system


let selected=null;



document.querySelectorAll(".piece").forEach(piece=>{


    piece.addEventListener("pointerdown", e=>{


        selected=piece;


        piece.setPointerCapture(e.pointerId);


        piece.style.opacity="0.5";


    });




    piece.addEventListener("pointerup", e=>{


        if(selected){


            let target=document.elementFromPoint(
                e.clientX,
                e.clientY
            );



            if(
                target &&
                target.classList.contains("piece") &&
                target !== selected
            ){


                let temp =
                selected.style.backgroundPosition;



                selected.style.backgroundPosition =
                target.style.backgroundPosition;



                target.style.backgroundPosition =
                temp;


            }



            selected.style.opacity="1";


            selected=null;


            checkPuzzle();


        }


    });


});






function checkPuzzle(){


    let solved=true;



    document.querySelectorAll(".piece")
    .forEach((piece,index)=>{


        let x=index%4;

        let y=Math.floor(index/4);



        let correct =
        `${x * 33.33}% ${y * 33.33}%`;



        if(piece.style.backgroundPosition !== correct){

            solved=false;

        }


    });





    if(solved){


        document.getElementById("puzzle").style.display="none";


        document.querySelector("body > h1").style.display="none";


        document.getElementById("win").style.display="block";


    }


}



</script>


</body>
</html>
