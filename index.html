<!DOCTYPE html>
<html>
<head>
<title>MILANA PUZZLE ❤️</title>

<style>

body {
    background:#ffe6ee;
    font-family:Arial, sans-serif;
    text-align:center;
    overflow:hidden;
    position:relative;
}


h1 {
    color:#ff4d88;
}


/* floating hearts */

.heart {
    position:fixed;
    bottom:-50px;
    font-size:25px;
    animation:float 8s linear infinite;
    opacity:0.7;
    z-index:-1;
}


@keyframes float {

    0% {
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }

    20% {
        opacity:1;
    }

    100% {
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }

}



#puzzle {

    width:90vw;
    max-width:600px;
    aspect-ratio:1;
    margin:20px auto;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:2px;
}


.piece {

    width:100%;
    aspect-ratio:1;

    background-image:url("puzzle.webp");
    background-size:400% 400%;
    background-repeat:no-repeat;

    border:1px solid white;

    touch-action:none;
}



#win {

    display:none;

}



a {

    display:inline-block;

    margin-top:20px;

    background:#ff4d88;

    color:white;

    padding:15px 25px;

    border-radius:20px;

    text-decoration:none;

    font-size:18px;

}

</style>

</head>


<body>


<h1>HAI MILANA ❤️</h1>


<div id="puzzle"></div>



<div id="win">

<h1>URAAAA! ❤️</h1>

<p>PRIMUL PAS NA BAZU)!</p>


<a href="https://stefxdd.github.io/LoveYouMilana/" class="endButton">
Urmatoarea statie
</a>


</div>





<script>


// hearts background

function createHeart(){

    let heart=document.createElement("div");

    heart.className="heart";

    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";

    heart.style.animationDuration=
    (5+Math.random()*5)+"s";

    heart.style.fontSize=
    (15+Math.random()*25)+"px";


    document.body.appendChild(heart);


    setTimeout(()=>{
        heart.remove();
    },10000);

}


setInterval(createHeart,500);





const puzzle = document.getElementById("puzzle");

let pieces=[];



for(let i=0;i<16;i++){

    let piece=document.createElement("div");

    piece.className="piece";


    let x=i%4;

    let y=Math.floor(i/4);



    piece.style.backgroundPosition =
    `${x*33.33}% ${y*33.33}%`;


    piece.dataset.correct=i;


    pieces.push(piece);

}





pieces.sort(()=>Math.random()-0.5);



pieces.forEach(piece=>{

    puzzle.appendChild(piece);

});





let selected=null;



document.querySelectorAll(".piece").forEach(piece=>{


piece.addEventListener("pointerdown",e=>{

    selected=piece;

    piece.setPointerCapture(e.pointerId);

    piece.style.opacity="0.5";

});




piece.addEventListener("pointerup",e=>{


if(selected){


let target=document.elementFromPoint(
e.clientX,
e.clientY
);



if(target &&
target.classList.contains("piece") &&
target!==selected){


let temp=selected.style.backgroundPosition;


selected.style.backgroundPosition=
target.style.backgroundPosition;


target.style.backgroundPosition=temp;


}



selected.style.opacity="1";

selected=null;


checkPuzzle();


}


});


});






function checkPuzzle(){


let solved=true;



document.querySelectorAll(".piece")
.forEach((piece,index)=>{


let x=index%4;

let y=Math.floor(index/4);



let correct=
`${x*33.33}% ${y*33.33}%`;



if(piece.style.backgroundPosition!==correct){

solved=false;

}


});





if(solved){


document.getElementById("puzzle").style.display="none";


document.querySelector("body > h1").style.display="none";


document.getElementById("win").style.display="block";


}


}


</script>


</body>
</html>
